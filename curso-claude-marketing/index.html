<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude para Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9EBE4; --rail:#EDEEE8;
  --line:#D6D9CF; --line-soft:#E3E5DC;
  --ink:#1A1A17; --ink-2:#565A4E; --ink-3:#868B7B;
  --brass:#7E5F0F; --brass-bright:#A87E14; --brass-soft:#F0EAD6;
  --plum:#6B2D4F; --plum-soft:#F3E7EE; --plum-ink:#FBF6F8;
  --ok:#3B6B3F; --ok-soft:#E4EFE3; --pend:#9A6414;
  --on-brass:#FFFFFF; --focus:#7E5F0F;
  --shadow:0 1px 2px rgba(26,26,23,.05), 0 10px 28px -20px rgba(26,26,23,.35);
  --shadow-alto:0 4px 12px rgba(26,26,23,.08), 0 24px 60px -30px rgba(26,26,23,.5);
  --display:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Karla",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail-w:310px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181815; --surface:#20201C; --surface-2:#292923; --rail:#1D1D19;
    --line:#3A3A31; --line-soft:#2C2C25;
    --ink:#EAEAE1; --ink-2:#B0B0A2; --ink-3:#7E7E70;
    --brass:#D9A83A; --brass-bright:#EDBF52; --brass-soft:#2E2718;
    --plum:#D79BBB; --plum-soft:#2C1D25; --plum-ink:#241820;
    --ok:#7FB682; --ok-soft:#1E2A1E; --pend:#D9A83A;
    --on-brass:#1A1A17; --focus:#D9A83A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -22px rgba(0,0,0,.9);
    --shadow-alto:0 4px 12px rgba(0,0,0,.5), 0 28px 70px -30px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --paper:#181815; --surface:#20201C; --surface-2:#292923; --rail:#1D1D19;
  --line:#3A3A31; --line-soft:#2C2C25;
  --ink:#EAEAE1; --ink-2:#B0B0A2; --ink-3:#7E7E70;
  --brass:#D9A83A; --brass-bright:#EDBF52; --brass-soft:#2E2718;
  --plum:#D79BBB; --plum-soft:#2C1D25; --plum-ink:#241820;
  --ok:#7FB682; --ok-soft:#1E2A1E; --pend:#D9A83A;
  --on-brass:#1A1A17; --focus:#D9A83A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -22px rgba(0,0,0,.9);
  --shadow-alto:0 4px 12px rgba(0,0,0,.5), 0 28px 70px -30px rgba(0,0,0,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}

/* ---------------------------------------------------------------- rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-head{padding:20px 22px 14px;border-bottom:1px solid var(--line-soft)}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.rail-title{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;letter-spacing:-.01em}
.rail-sub{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.45}

.sesion{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
.avatar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--brass);color:var(--on-brass);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.sesion-txt{flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.sesion-txt b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sesion-txt span{color:var(--ink-3);font-size:11px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11.5px;color:var(--ink-2)}
.ghost:hover{border-color:var(--brass);color:var(--brass)}

.pestanas{display:flex;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.pest{flex:1;background:none;border:0;border-radius:6px;padding:7px 2px;font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--ink-3);text-transform:uppercase;white-space:nowrap}
.pest:hover{background:var(--surface-2);color:var(--ink-2)}
.pest[aria-selected="true"]{background:var(--brass-soft);color:var(--brass);font-weight:700}

.search-zone{padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.search{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
.search::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:6px;margin-top:9px}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-2);text-align:center}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:700}

.tree{flex:1;overflow-y:auto;padding:8px 10px 28px}
.mod{margin:0 0 4px}
.mod-btn{width:100%;display:flex;align-items:baseline;gap:9px;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px}
.mod-btn:hover{background:var(--surface-2)}
.mod-n{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--brass);letter-spacing:.06em;flex:0 0 auto}
.mod-name{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;flex:1;letter-spacing:-.005em}
.mod-chev{flex:0 0 auto;color:var(--ink-3);font-size:11px;transition:transform .18s ease}
.mod[data-open="false"] .mod-chev{transform:rotate(-90deg)}
.mod[data-open="false"] .les-list{display:none}
.les-list{list-style:none;margin:0 0 6px 16px;padding:0 0 0 10px;border-left:1px solid var(--line-soft)}
.les-btn{width:100%;display:flex;align-items:flex-start;gap:8px;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;font-size:13.5px;line-height:1.35;color:var(--ink-2)}
.les-btn:hover{background:var(--surface-2);color:var(--ink)}
.les-btn[aria-current="true"]{background:var(--brass-soft);color:var(--ink);font-weight:600}
.les-plat{flex:0 0 auto;width:3px;height:14px;border-radius:2px;margin-top:4px;background:var(--brass)}
.les-plat.cowork{background:var(--plum)}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:6px;border:1.5px solid var(--ink-3);background:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.pend{border-color:var(--pend);border-style:dashed}
.les-t{flex:1}
.les-min{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:0 0 auto;margin-top:2px}
.rail-foot{padding:11px 18px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.byline{font-size:11.5px;color:var(--ink-3);line-height:1.3}

/* ------------------------------------------------------------ contenido */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--rail);position:sticky;top:0;z-index:20}
.lesson{width:100%;max-width:760px;margin:0 auto;padding:52px 40px 96px;flex:1}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin:0 0 14px;font-weight:500}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,42px);line-height:1.08;letter-spacing:-.022em;margin:0 0 16px;text-wrap:balance}
h2.seccion{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.015em;margin:40px 0 16px;text-wrap:balance}
.objetivo{display:flex;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;margin:0 0 10px}
.objetivo .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:0 0 68px;padding-top:3px}
.objetivo p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.5}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;margin:0 0 34px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--brass-soft);color:var(--brass)}
.badge.cowork{background:var(--plum-soft);color:var(--plum)}

.body p{margin:0 0 20px;font-size:17px;line-height:1.68;max-width:66ch}
.body p a{color:var(--brass);text-decoration:underline;text-underline-offset:2px}
.body code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.body ul,.body ol{margin:0 0 22px;padding-left:22px;max-width:64ch}
.body li{margin:0 0 8px;font-size:16.5px;line-height:1.6}
.body ol li::marker{font-family:var(--mono);font-size:.8em;color:var(--brass);font-weight:700}
.body ul li::marker{color:var(--brass)}

.prompt{margin:0 0 24px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--plum-ink)}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:var(--plum-soft);border-bottom:1px solid var(--line-soft)}
.prompt-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--plum);font-weight:700}
.copy{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-2)}
.copy:hover{border-color:var(--plum);color:var(--plum)}
.copy.ok{border-color:var(--ok);color:var(--ok)}
.prompt pre{margin:0;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.archivo{margin:0 0 24px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.archivo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:var(--brass-soft);border-bottom:1px solid var(--line-soft)}
.archivo-lbl{font-family:var(--mono);font-size:11px;color:var(--brass);font-weight:700;letter-spacing:.03em}
.archivo .copy:hover{border-color:var(--brass);color:var(--brass)}
.archivo pre{margin:0;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--ink);white-space:pre}
.ejemplo{margin:0 0 24px;border-left:2px solid var(--line);padding:2px 0 2px 18px}
.ejemplo .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.ejemplo pre{margin:0;font-family:var(--sans);font-size:15.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap}
.aviso{display:flex;gap:12px;margin:0 0 24px;padding:14px 16px;background:var(--brass-soft);border-radius:9px;max-width:66ch}
.aviso .mark{font-family:var(--mono);font-weight:700;color:var(--brass);flex:0 0 auto;font-size:14px;line-height:1.5}
.aviso p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink)}
.clave{margin:6px 0 28px;padding:0 0 0 20px;border-left:3px solid var(--brass);max-width:62ch}
.clave p{margin:0;font-family:var(--display);font-weight:500;font-size:20px;line-height:1.4;letter-spacing:-.012em}
.tabla-wrap{overflow-x:auto;margin:0 0 26px;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
th{text-align:left;padding:11px 14px;background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
blockquote{margin:0 0 24px;padding:0 0 0 20px;border-left:2px solid var(--plum);max-width:62ch}
blockquote p{font-family:var(--display);font-size:19px;font-style:italic;line-height:1.45;margin:0 0 6px}
blockquote cite{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-style:normal}
.video-wrap{margin:0 0 26px;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:var(--surface-2)}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.hueco{border:1px dashed var(--line);border-radius:10px;padding:30px 26px;text-align:center;background:var(--surface)}
.hueco .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pend);margin:0 0 8px}
.hueco p{margin:0 auto;max-width:44ch;font-size:15px;color:var(--ink-2)}

.cierre{margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.ejercicio{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--plum);border-radius:9px;padding:18px 20px;margin:0 0 26px}
.ejercicio .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--plum);margin:0 0 8px;font-weight:700}
.ejercicio p{margin:0;font-size:16px;line-height:1.6}
.recursos{margin:0 0 26px}
.recursos .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.recursos a{display:block;color:var(--brass);font-size:15px;padding:3px 0;text-decoration:underline;text-underline-offset:2px}

.notas{margin:0 0 26px}
.notas-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 8px}
.notas .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0}
.notas-estado{font-family:var(--mono);font-size:10.5px;color:var(--ok)}
.notas textarea{width:100%;min-height:104px;resize:vertical;padding:13px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:15.5px;line-height:1.55}
.notas textarea::placeholder{color:var(--ink-3)}

.acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 30px}
.marcar{background:var(--brass);color:var(--on-brass);border:1px solid var(--brass);border-radius:8px;padding:10px 18px;font-weight:600;font-size:14.5px}
.marcar:hover{background:var(--brass-bright);border-color:var(--brass-bright)}
.marcar[data-done="true"]{background:transparent;color:var(--ok);border-color:var(--ok)}
.nav{display:flex;gap:12px;justify-content:space-between}
.nav-btn{flex:1;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 16px;min-width:0}
.nav-btn:hover{border-color:var(--brass)}
.nav-btn.next{text-align:right}
.nav-btn .dir{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.nav-btn .t{font-size:14.5px;font-weight:600;line-height:1.3;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn[disabled]{opacity:.35;cursor:default}
.nav-btn[disabled]:hover{border-color:var(--line)}
.mod-intro{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:20px 22px;margin:0 0 30px}
.mod-intro p{margin:0;font-size:16px;color:var(--ink-2);line-height:1.55}

/* -------------------------------------------------- panel de progreso */
.hero-cifra{display:flex;align-items:baseline;gap:14px;margin:0 0 6px}
.hero-cifra .n{font-family:var(--display);font-weight:700;font-size:clamp(56px,9vw,84px);line-height:.9;letter-spacing:-.03em;color:var(--brass);font-variant-numeric:tabular-nums}
.hero-cifra .u{font-family:var(--display);font-size:26px;color:var(--ink-3);font-weight:500}
.hero-pie{font-size:16px;color:var(--ink-2);margin:0 0 34px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 36px}
.kpi{background:var(--surface);padding:15px 16px}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.kpi .v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:3px}

.medidores{display:flex;flex-direction:column;gap:14px;margin:0 0 36px}
.med-fila{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.med-nom{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.005em}
.med-cif{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.med-pista{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.med-relleno{display:block;height:100%;border-radius:4px;background:var(--brass);transition:width .5s ease}
.med-relleno[data-lleno="true"]{background:var(--ok)}

/* ---------------------------------------------------------------- taller */
.taller{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
.t-campos{min-width:0;display:flex;flex-direction:column;gap:20px}
.t-lado{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px}
.t-grupo{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.t-grupo>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.t-grupo h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.t-grupo .peso{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.t-cuerpo{padding:14px 15px;display:flex;flex-direction:column;gap:13px}
.t-campo label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.t-campo .pista{display:block;font-weight:400;color:var(--ink-3);font-size:12px;margin-top:2px}
.t-campo textarea{width:100%;min-height:62px;overflow:hidden;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.5}
.t-campo textarea:focus{border-color:var(--brass)}
.t-campo textarea::placeholder{color:var(--ink-3)}
.t-rapidos{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.t-rapido{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:3px 10px;font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.03em}
.t-rapido:hover{border-color:var(--brass);color:var(--brass)}

.t-marcador{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 16px}
.t-marcador .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.t-veredicto{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.012em;line-height:1.25;margin:0 0 10px}
.t-pista-barra{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:0 0 8px}
.t-relleno{display:block;height:100%;border-radius:4px;background:var(--brass);transition:width .4s ease}
.t-relleno[data-nivel="alto"]{background:var(--ok)}
.t-relleno[data-nivel="bajo"]{background:var(--plum)}
.t-marcador .sub{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}

.t-diag{display:flex;flex-direction:column;gap:9px}
.d{border:1px solid var(--line);border-left-width:3px;border-radius:9px;background:var(--surface);padding:11px 13px}
.d[data-n="error"]{border-left-color:var(--plum)}
.d[data-n="aviso"]{border-left-color:var(--brass)}
.d[data-n="bien"]{border-left-color:var(--ok)}
.d .cab{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.d .et{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.d[data-n="error"] .et{color:var(--plum)}
.d[data-n="aviso"] .et{color:var(--brass)}
.d[data-n="bien"]  .et{color:var(--ok)}
.d .t{font-size:13.5px;font-weight:600;line-height:1.3;flex:1}
.d p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.d button.ver{background:none;border:0;padding:4px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--brass);text-decoration:underline;text-underline-offset:2px}
.t-limite{margin:4px 0 0;padding:11px 13px;border:1px dashed var(--line);border-radius:9px;font-size:12px;line-height:1.5;color:var(--ink-3);background:var(--surface)}

@media (max-width:1080px){
  .taller{grid-template-columns:1fr}
  .t-lado{position:static;order:-1}
}

/* --------------------------------------------------------------- portada */
.portada-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 16px;font-weight:700}
.portada h1{font-size:clamp(38px,6vw,58px);margin:0 0 12px}
.portada .lead{font-family:var(--display);font-weight:500;font-size:clamp(19px,2.6vw,23px);line-height:1.35;letter-spacing:-.012em;color:var(--ink-2);max-width:30ch;margin:0 0 30px}
.portada .intro{max-width:62ch;font-size:16.5px;line-height:1.65;color:var(--ink-2);margin:0 0 26px}
.mods-lista{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 34px}
.mod-fila{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:baseline;background:var(--surface);padding:15px 18px;text-align:left;border:0;width:100%}
.mod-fila:hover{background:var(--surface-2)}
.mod-fila .n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brass);letter-spacing:.06em}
.mod-fila .t{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.25}
.mod-fila .r{grid-column:2;font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:3px}
.mod-fila .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.requisitos{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px;margin:0 0 36px}
.req{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--surface)}
.req .b{margin:0 0 7px}
.req p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.colofon{margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.colofon .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.colofon .quien{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.014em;margin:0 0 6px}
.colofon p{margin:0 0 10px;font-size:15px;line-height:1.55;color:var(--ink-2);max-width:56ch}
.colofon a{color:var(--brass);text-decoration:underline;text-underline-offset:2px}
.licencia{margin:22px 0 0;padding:12px 15px;border:1px dashed var(--line);border-radius:9px;background:var(--surface);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.licencia b{color:var(--ink-2);font-weight:700}
.rail-title-btn{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.rail-title-btn:hover .rail-title{color:var(--brass)}

.siguiente{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:10px;padding:18px 20px;margin:0 0 30px}
.siguiente:hover{border-color:var(--brass)}
.siguiente .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.siguiente .t{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.012em;margin:0 0 5px}
.siguiente .d{font-size:14.5px;color:var(--ink-2);margin:0}

/* ------------------------------------------------ biblioteca de prompts */
.prompt-filtros{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.pf{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-2)}
.pf:hover{border-color:var(--brass)}
.pf[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:700}
.p-origen{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin:0 0 7px;letter-spacing:.05em}
.p-origen button{background:none;border:0;padding:0;color:var(--brass);text-decoration:underline;text-underline-offset:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em}

/* ---------------------------------------------------------- glosario */
.glos{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gl{background:var(--surface);padding:16px 18px}
.gl dt{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gl-cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.gl dd{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}

/* -------------------------------------------------------------- acceso */
.velo{position:fixed;inset:0;background:rgba(12,12,10,.55);z-index:60;display:grid;place-items:center;padding:22px;overflow-y:auto}
.tarjeta{width:100%;max-width:412px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-alto);padding:30px 30px 26px}
.tarjeta h2{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:-.018em;margin:0 0 6px}
.tarjeta .lead{margin:0 0 22px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.campo{margin:0 0 14px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.campo input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.campo input:focus{border-color:var(--brass)}
.principal{width:100%;background:var(--brass);color:var(--on-brass);border:1px solid var(--brass);border-radius:8px;padding:11px 18px;font-weight:600;font-size:15px;margin-top:6px}
.principal:hover{background:var(--brass-bright);border-color:var(--brass-bright)}
.principal[disabled]{opacity:.55;cursor:default}
.alterno{display:block;width:100%;background:none;border:0;padding:14px 0 0;font-size:13.5px;color:var(--ink-2);text-align:center}
.alterno b{color:var(--brass);text-decoration:underline;text-underline-offset:2px}
.error{margin:12px 0 0;padding:10px 13px;border-radius:8px;background:var(--plum-soft);color:var(--plum);font-size:13.5px;line-height:1.45}
.nota-modo{margin:18px 0 0;padding-top:15px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-3);line-height:1.5}

.aviso-demo{display:flex;gap:11px;align-items:flex-start;margin:0 0 30px;padding:13px 16px;border:1px dashed var(--line);border-radius:9px;background:var(--surface);max-width:66ch}
.aviso-demo p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.aviso-demo .mark{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);flex:0 0 auto;padding-top:2px}

.vacio{padding:44px 26px;text-align:center;color:var(--ink-3);font-size:15px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;height:100vh;transform:translateX(-101%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .rail[data-open="true"]{transform:none}
  .topbar{display:flex}
  .lesson{padding:30px 20px 72px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="rail" id="rail" data-open="false">
    <div class="rail-head">
      <p class="eyebrow" id="eyebrow">Curso</p>
      <button class="rail-title-btn" type="button" data-vista="inicio">
        <h2 class="rail-title" id="railTitle">—</h2>
      </button>
      <p class="rail-sub" id="railSub"></p>
    </div>

    <div class="sesion" id="sesionZona"></div>

    <div class="pestanas" role="tablist">
      <button class="pest" type="button" role="tab" data-vista="curso"    aria-selected="true">Curso</button>
      <button class="pest" type="button" role="tab" data-vista="taller"   aria-selected="false">Taller</button>
      <button class="pest" type="button" role="tab" data-vista="prompts"  aria-selected="false">Prompts</button>
      <button class="pest" type="button" role="tab" data-vista="progreso" aria-selected="false">Avance</button>
      <button class="pest" type="button" role="tab" data-vista="glosario" aria-selected="false">Glosario</button>
    </div>

    <div class="search-zone" id="zonaBusca">
      <input class="search" id="search" type="search" placeholder="Buscar lección…" aria-label="Buscar lección">
      <div class="chips" role="group" aria-label="Filtrar por producto">
        <button class="chip" type="button" data-plat="todo" aria-pressed="true">TODO</button>
        <button class="chip" type="button" data-plat="Claude.ai" aria-pressed="false">CLAUDE.AI</button>
        <button class="chip" type="button" data-plat="Cowork" aria-pressed="false">COWORK</button>
      </div>
    </div>

    <nav class="tree" id="tree" aria-label="Índice del curso"></nav>

    <div class="rail-foot">
      <span class="byline" id="byline"></span>
      <button class="ghost" id="themeBtn" type="button">Tema</button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="topbar">
      <button class="ghost" id="menuBtn" type="button">Índice</button>
      <strong style="font-family:var(--display);font-size:16px" id="topTitle"></strong>
    </div>
    <article class="lesson" id="vista"></article>
  </main>
</div>

<div class="velo" id="velo" hidden></div>

<script src="config.js"></script>
<script src="contenido.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var CFG = (typeof CONFIG !== "undefined") ? CONFIG : {};
  CFG.licencia = CFG.licencia || { nombre:"", email:"", emitida:"" };
  CFG.autor = CFG.autor || {};
  var LIC = !!(CFG.licencia.nombre);
  var NUBE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey) && !LIC;
  var LLAVE = "curso-claude-marketing:v2";

  /* =================================================== utilidades de texto */
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function md(s){
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return out;
  }
  function embedUrl(u){
    var m = String(u).match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{6,})/);
    if(m) return "https://www.youtube.com/embed/" + m[1];
    var v = String(u).match(/vimeo\.com\/(\d+)/);
    if(v) return "https://player.vimeo.com/video/" + v[1];
    return u;
  }
  function iniciales(nombre){
    var p = String(nombre||"").trim().split(/\s+/).filter(Boolean);
    if(!p.length) return "?";
    return (p[0][0] + (p.length > 1 ? p[p.length-1][0] : "")).toUpperCase();
  }
  function guardaLocal(k,v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function leeLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  /* ============================================================ el temario */
  var planas = [];
  CURSO.modulos.forEach(function(mod, mi){
    mod.lecciones.forEach(function(les, li){
      planas.push({ les:les, mod:mod, mi:mi+1, li:li+1 });
    });
  });
  function indicePorId(id){
    for(var i=0;i<planas.length;i++){ if(planas[i].les.id === id) return i; }
    return -1;
  }

  /* ================================================================ sesión */
  var sesion = { usuario:null, sb:null };

  function claveUsuario(){
    return LLAVE + ":" + (sesion.usuario ? sesion.usuario.id : "invitado");
  }
  function usuariosLocales(){
    try{ return JSON.parse(leeLocal(LLAVE + ":usuarios") || "[]"); }catch(e){ return []; }
  }
  function guardaUsuariosLocales(l){ guardaLocal(LLAVE + ":usuarios", JSON.stringify(l)); }

  /* ============================================================== almacén */
  var Almacen = {
    hechas: {},
    notas: {},

    cargar: function(){
      if(NUBE && sesion.sb && sesion.usuario) return this.cargarNube();
      return this.cargarLocal();
    },
    cargarLocal: function(){
      try{ this.hechas = JSON.parse(leeLocal(claveUsuario() + ":progreso") || "{}") || {}; }
      catch(e){ this.hechas = {}; }
      try{ this.notas = JSON.parse(leeLocal(claveUsuario() + ":notas") || "{}") || {}; }
      catch(e){ this.notas = {}; }
      return Promise.resolve();
    },
    cargarNube: function(){
      var self = this, sb = sesion.sb, uid = sesion.usuario.id;
      return Promise.all([
        sb.from("progreso").select("leccion_id").eq("usuario_id", uid),
        sb.from("notas").select("leccion_id,texto").eq("usuario_id", uid)
      ]).then(function(r){
        self.hechas = {}; self.notas = {};
        (r[0].data || []).forEach(function(f){ self.hechas[f.leccion_id] = true; });
        (r[1].data || []).forEach(function(f){ self.notas[f.leccion_id] = f.texto; });
      }).catch(function(){ return self.cargarLocal(); });
    },

    marcar: function(id, hecho){
      if(hecho) this.hechas[id] = true; else delete this.hechas[id];
      if(NUBE && sesion.sb && sesion.usuario){
        var sb = sesion.sb, uid = sesion.usuario.id;
        if(hecho) sb.from("progreso").upsert({ usuario_id:uid, leccion_id:id }).then(null, function(){});
        else sb.from("progreso").delete().eq("usuario_id", uid).eq("leccion_id", id).then(null, function(){});
      }else{
        guardaLocal(claveUsuario() + ":progreso", JSON.stringify(this.hechas));
      }
    },

    guardarNota: function(id, texto){
      this.notas[id] = texto;
      if(NUBE && sesion.sb && sesion.usuario){
        return sesion.sb.from("notas").upsert({
          usuario_id: sesion.usuario.id, leccion_id:id, texto:texto, editada_en:new Date().toISOString()
        });
      }
      guardaLocal(claveUsuario() + ":notas", JSON.stringify(this.notas));
      return Promise.resolve();
    }
  };

  /* ============================================================== estado */
  var vista = "curso";
  var filtroPlat = "todo";
  var filtroPrompt = "todo";
  var actual = 0;

  /* ========================================================== render: rail */
  function pintarCabecera(){
    $("railTitle").textContent = CURSO.titulo;
    $("railSub").textContent = CURSO.subtitulo || "";
    $("byline").textContent = CURSO.autor || "";
    $("eyebrow").textContent = "Curso · v" + (CURSO.version || "1");
    document.title = CURSO.titulo;
  }

  function pintarSesion(){
    var z = $("sesionZona");
    if(LIC){
      z.innerHTML = '<span class="avatar">' + esc(iniciales(CFG.licencia.nombre)) + '</span>' +
        '<span class="sesion-txt"><b>' + esc(CFG.licencia.nombre) + '</b>' +
        '<span>copia con licencia</span></span>';
      return;
    }
    if(sesion.usuario){
      z.innerHTML = '<span class="avatar">' + esc(iniciales(sesion.usuario.nombre)) + '</span>' +
        '<span class="sesion-txt"><b>' + esc(sesion.usuario.nombre) + '</b>' +
        '<span>' + (NUBE ? "sesión sincronizada" : "solo en este equipo") + '</span></span>' +
        '<button class="ghost" type="button" id="salirBtn">Salir</button>';
    }else{
      z.innerHTML = '<span class="sesion-txt"><b>Sin identificar</b>' +
        '<span>el avance no se guarda con tu nombre</span></span>' +
        '<button class="ghost" type="button" id="entrarBtn">Entrar</button>';
    }
  }

  function pintarArbol(){
    var f = ($("search").value || "").trim().toLowerCase();
    var html = "";
    CURSO.modulos.forEach(function(mod, mi){
      var visibles = mod.lecciones.filter(function(les){
        if(filtroPlat !== "todo" && (les.plataforma || "Claude.ai") !== filtroPlat) return false;
        if(!f) return true;
        return (les.titulo + " " + (les.objetivo||"")).toLowerCase().indexOf(f) >= 0;
      });
      if(!visibles.length) return;
      var abierto = (f || filtroPlat !== "todo") ? true
                  : (planas[actual] && planas[actual].mod.id === mod.id);
      html += '<div class="mod" data-open="' + (abierto ? "true" : "false") + '">';
      html += '<button class="mod-btn" type="button" data-toggle="1">' +
              '<span class="mod-n">M' + (mi+1) + '</span>' +
              '<span class="mod-name">' + esc(mod.titulo) + '</span>' +
              '<span class="mod-chev">&#9660;</span></button><ul class="les-list">';
      visibles.forEach(function(les){
        var i = indicePorId(les.id);
        var cls = Almacen.hechas[les.id] ? "done" : (les.estado === "pendiente" ? "pend" : "");
        var pl = (les.plataforma === "Cowork") ? " cowork" : "";
        html += '<li><button class="les-btn" type="button" data-ir="' + i + '"' +
                (i === actual && vista === "curso" ? ' aria-current="true"' : '') +
                ' title="' + esc(les.plataforma || "Claude.ai") + '">' +
                '<span class="les-plat' + pl + '"></span>' +
                '<span class="dot ' + cls + '"></span>' +
                '<span class="les-t">' + esc(les.titulo) + '</span>' +
                '<span class="les-min">' + (les.duracion || "") + '</span></button></li>';
      });
      html += '</ul></div>';
    });
    $("tree").innerHTML = html ||
      '<p style="padding:18px;color:var(--ink-3);font-size:13.5px">Ninguna lección coincide.</p>';
  }

  /* ====================================================== render: bloques */
  function pintarBloque(b){
    switch(b.t){
      case "texto":   return "<p>" + md(b.md || "") + "</p>";
      case "lista":   return "<ul>" + (b.items||[]).map(function(x){ return "<li>" + md(x) + "</li>"; }).join("") + "</ul>";
      case "pasos":   return "<ol>" + (b.items||[]).map(function(x){ return "<li>" + md(x) + "</li>"; }).join("") + "</ol>";
      case "prompt":
        return '<div class="prompt"><div class="prompt-head">' +
               '<span class="prompt-lbl">Prompt' + (b.titulo ? " · " + esc(b.titulo) : "") + '</span>' +
               '<button class="copy" type="button" data-copiar>Copiar</button>' +
               '</div><pre>' + esc(b.texto || "") + '</pre></div>';
      case "archivo":
        return '<div class="archivo"><div class="archivo-head">' +
               '<span class="archivo-lbl">' + esc(b.nombre || "archivo") + '</span>' +
               '<button class="copy" type="button" data-copiar>Copiar</button>' +
               '</div><pre>' + esc(b.texto || "") + '</pre></div>';
      case "ejemplo":
        return '<div class="ejemplo"><p class="lbl">' + esc(b.titulo || "Ejemplo") + '</p>' +
               '<pre>' + esc(b.texto || "") + '</pre></div>';
      case "aviso":
        return '<div class="aviso"><span class="mark">!</span><p>' + md(b.texto || "") + '</p></div>';
      case "clave":
        return '<div class="clave"><p>' + md(b.texto || "") + '</p></div>';
      case "tabla":
        return '<div class="tabla-wrap"><table><thead><tr>' +
               (b.cabeceras||[]).map(function(c){ return "<th>" + esc(c) + "</th>"; }).join("") +
               '</tr></thead><tbody>' +
               (b.filas||[]).map(function(fila){
                 return "<tr>" + fila.map(function(c){ return "<td>" + md(c) + "</td>"; }).join("") + "</tr>";
               }).join("") + '</tbody></table></div>';
      case "cita":
        return "<blockquote><p>" + md(b.texto || "") + "</p>" +
               (b.autor ? "<cite>" + esc(b.autor) + "</cite>" : "") + "</blockquote>";
      case "video":
        return '<div class="video-wrap"><iframe src="' + esc(embedUrl(b.url || "")) +
               '" title="' + esc(b.titulo || "Vídeo") + '" allowfullscreen loading="lazy"></iframe></div>';
      default: return "";
    }
  }

  /* ====================================================== vista: lección */
  function vistaCurso(){
    var p = planas[actual];
    if(!p) return "";
    var les = p.les, mod = p.mod, hecho = !!Almacen.hechas[les.id];
    var h = "";

    if(!sesion.usuario){
      h += '<div class="aviso-demo"><span class="mark">DEMO</span><p>' +
           'Estás viendo el curso sin identificarte. Puedes leerlo entero; el avance y las notas ' +
           'se guardan en este navegador y se pierden si lo cambias. ' +
           '<button class="copy" type="button" id="entrarInline" style="margin-left:4px">Entrar</button></p></div>';
    }

    h += '<p class="crumb">Módulo ' + p.mi + " · " + esc(mod.titulo) + " · Lección " + p.mi + "." + p.li + '</p>';
    h += "<h1>" + esc(les.titulo) + "</h1>";
    if(les.objetivo){
      h += '<div class="objetivo"><span class="lbl">Objetivo</span><p>' + md(les.objetivo) + "</p></div>";
    }
    var plat = les.plataforma || "Claude.ai";
    h += '<div class="meta"><span class="badge' + (plat === "Cowork" ? " cowork" : "") + '">' + esc(plat) + "</span>" +
         "<span>" + (les.duracion || "—") + " MIN</span><span>" +
         (hecho ? "COMPLETADA" : (les.estado === "pendiente" ? "SIN CONTENIDO" : "PENDIENTE DE LEER")) +
         "</span></div>";

    if(p.li === 1 && mod.resumen){
      h += '<div class="mod-intro"><p>' + md(mod.resumen) + "</p></div>";
    }

    h += '<div class="body">';
    h += (les.bloques && les.bloques.length)
       ? les.bloques.map(pintarBloque).join("")
       : '<div class="hueco"><p class="lbl">Contenido pendiente</p><p>Esta lección todavía no tiene ' +
         'material. El esqueleto está puesto: objetivo, duración y sitio en el temario.</p></div>';
    h += "</div>";

    h += '<div class="cierre">';
    if(les.ejercicio){
      h += '<div class="ejercicio"><p class="lbl">Ejercicio</p><p>' + md(les.ejercicio) + "</p></div>";
    }
    if(les.recursos && les.recursos.length){
      h += '<div class="recursos"><p class="lbl">Recursos</p>' +
           les.recursos.map(function(r){
             return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.titulo) + "</a>";
           }).join("") + "</div>";
    }

    h += '<div class="notas"><div class="notas-head"><p class="lbl">Tus notas</p>' +
         '<span class="notas-estado" id="notaEstado"></span></div>' +
         '<textarea id="notaTxt" placeholder="Lo que te has llevado de esta lección, o lo que vas a aplicar el lunes.">' +
         esc(Almacen.notas[les.id] || "") + '</textarea></div>';

    h += '<div class="acciones"><button class="marcar" type="button" id="marcar" data-done="' +
         (hecho ? "true" : "false") + '">' +
         (hecho ? "&#10003; Completada" : "Marcar como completada") + "</button></div>";

    var ant = planas[actual-1], sig = planas[actual+1];
    if(!sig){
      h += '<div class="clave" style="margin-top:10px"><p>Hasta aquí el curso. ' +
           'Lo que hayas construido —la skill de marca, las plantillas, los informes— ' +
           'vale más que las lecciones: eso se queda contigo.</p></div>' + colofon();
    }
    h += '<div class="nav">' +
         '<button class="nav-btn" type="button" data-ir="' + (actual-1) + '"' + (ant ? "" : " disabled") + '>' +
         '<span class="dir">Anterior</span><span class="t">' + (ant ? esc(ant.les.titulo) : "—") + "</span></button>" +
         '<button class="nav-btn next" type="button" data-ir="' + (actual+1) + '"' + (sig ? "" : " disabled") + '>' +
         '<span class="dir">Siguiente</span><span class="t">' + (sig ? esc(sig.les.titulo) : "—") + "</span></button>" +
         "</div></div>";
    return h;
  }


  /* ======================================================== EL TALLER =====
     Constructor de prompts con corrección en tiempo real. Las reglas son
     deterministas y corren en el navegador: funcionan sin conexión y sin
     servidor, que es lo que necesita un archivo que se vende.

     Lo que esto SÍ hace: detectar piezas que faltan y errores conocidos que
     el curso enseña a evitar.
     Lo que NO hace: juzgar si tu contexto es bueno. Eso no lo puede saber una
     regla, y el propio taller lo dice para que nadie se fíe de un aprobado.
     ==================================================================== */

  var CAMPOS = ["negocio","cliente","objecion","probado","tarea","formato","restricciones","ejemplos"];
  var borrador = null;

  function cargarBorrador(){
    try{ borrador = JSON.parse(leeLocal(claveUsuario() + ":taller") || "null"); }catch(e){ borrador = null; }
    if(!borrador){ borrador = {}; CAMPOS.forEach(function(c){ borrador[c] = ""; }); }
    CAMPOS.forEach(function(c){ if(typeof borrador[c] !== "string") borrador[c] = ""; });
  }
  function guardarBorrador(){ guardaLocal(claveUsuario() + ":taller", JSON.stringify(borrador)); }

  var EJEMPLO = {
    negocio: "Instalación de placas solares para particulares en Valencia. Ticket medio 7.500 €.",
    cliente: "45-60 años, casa unifamiliar. Su motivación no es la ecología: le ha subido la factura y está harto.",
    objecion: "\"¿Y si me mudo antes de amortizarlo?\"",
    probado: "Anuncios hablando de sostenibilidad y ahorro en porcentaje. Muchos clics, ninguna llamada.",
    tarea: "Escribe 5 titulares para Meta Ads que ataquen directamente esa objeción.",
    formato: "Un titular por línea, máximo 40 caracteres cada uno.",
    restricciones: "No uses \"sostenible\" ni \"medio ambiente\". Nada de urgencia falsa. No prometas un porcentaje de ahorro.",
    ejemplos: ""
  };

  var VAGOS = ["mejor","creativo","creativa","atractivo","atractiva","impactante","profesional",
               "de calidad","potente","innovador","innovadora","disruptivo","moderno","óptimo",
               "llamativo","espectacular","persuasivo"];
  var VERBOS = ["escribe","redacta","analiza","lista","enumera","reescribe","adapta","resume",
                "compara","audita","convierte","extrae","clasifica","genera","crea","propón",
                "revisa","traduce","ordena","calcula","diseña","monta","prepara","saca","dame","hazme"];

  function vac(x){ return !String(x||"").trim(); }
  function largo(x){ return String(x||"").trim().length; }
  function tiene(x, re){ return re.test(String(x||"")); }

  function analizar(){
    var d = borrador;
    var ctx = [d.negocio, d.cliente, d.objecion, d.probado].join(" ");
    var instrucciones = [d.tarea, d.formato].join(" ");
    var todo = CAMPOS.map(function(c){ return d[c]; }).join(" ");
    var r = [];
    var add = function(nivel, t, p, lec){ r.push({ n:nivel, t:t, p:p, lec:lec }); };

    /* --- lo que nunca debería salir de aquí ------------------------------ */
    if(tiene(todo, /[\w.+-]+@[\w-]+\.\w{2,}/) || tiene(todo, /\b\d{8,}\b/) ||
       tiene(todo, /\b(dni|nif|iban|n[úu]mero de tarjeta|contrase[ñn]a)\b/i)){
      add("error", "Hay datos personales aquí dentro",
          "Un correo, un número largo o un identificador. Antes de pegar datos de un cliente en ninguna herramienta, mira qué firmaste con él. Que sea cómodo no significa que esté permitido.", "m1-l6");
    }

    /* --- las piezas ------------------------------------------------------ */
    if(vac(d.negocio))
      add("error", "Falta qué vendes",
          "Sin saber el producto y su precio, cualquier texto vale para cualquiera. Es la pieza más barata de rellenar.", "m1-l2");

    if(vac(d.cliente))
      add("error", "Falta a quién se lo vendes",
          "La calidad de la salida es función del contexto, no del adjetivo que le pongas a la orden. Sin cliente, sale genérico por definición.", "m1-l1");
    else if(largo(d.cliente) < 45)
      add("aviso", "El cliente está descrito muy por encima",
          "Añade qué le duele y en qué momento aparece ese dolor. Un perfil de una línea produce copy de una línea.", "m2-l1");

    if(vac(d.objecion))
      add("aviso", "No has puesto ninguna objeción",
          "La objeción real que te sale en llamada es lo que separa un anuncio que vende de uno correcto. Es la pieza que más rinde de las cuatro.", "m2-l1");
    else
      add("bien", "Tienes la objeción puesta", "Es la pieza que más rinde del contexto.", null);

    if(vac(d.tarea))
      add("error", "No has dicho qué quieres",
          "Un verbo, un entregable y una cantidad. \"Ayúdame con el email\" no es una tarea.", "m1-l2");

    /* --- cómo está pedida la tarea --------------------------------------- */
    if(!vac(d.tarea)){
      var t0 = d.tarea.trim().toLowerCase();
      var empiezaBien = VERBOS.some(function(v){ return t0.indexOf(v) === 0; });
      if(!empiezaBien)
        add("aviso", "La tarea no empieza por un verbo",
            "Empieza por lo que tiene que hacer: escribe, analiza, lista, reescribe, compara. El verbo fija el entregable.", "m1-l2");

      if(!tiene(d.tarea, /\d/))
        add("aviso", "No has pedido una cantidad",
            "Sin número te devuelve una opción y te quedas con ella. Pide cinco y eliges tú: elegir es más barato que corregir.", "m1-l2");
      else
        add("bien", "Has pedido una cantidad concreta", "Así eliges en vez de corregir.", null);

      var nverbos = VERBOS.filter(function(v){ return t0.indexOf(v) >= 0; }).length;
      if(nverbos > 1 && / y /.test(t0))
        add("aviso", "Parece que hay dos tareas en una",
            "Dos entregables en la misma petición salen los dos a medias. Sepáralas en dos mensajes.", "m1-l2");

      var pide = (d.tarea.match(/\b(\d+)\b/) || [])[1];
      if(pide && parseInt(pide,10) >= 4 &&
         !tiene(todo, /antes de escribir|primero|para y espera|no escribas todav|en dos fases|dos fases/i))
        add("aviso", "Pídele que piense antes de producir",
            "Si le pides directamente las piezas, te da piezas. Si primero le pides los ángulos posibles y que pare, corriges el ángulo en vez de corregir cinco textos.", "m1-l2");
      else if(tiene(todo, /antes de escribir|para y espera|no escribas todav|dos fases/i))
        add("bien", "Le has pedido una fase previa", "Corregir el ángulo cuesta menos que corregir el resultado.", null);
    }

    /* --- adjetivos en vez de reglas, solo donde son instrucciones -------- */
    var pillados = VAGOS.filter(function(v){
      return new RegExp("\\b" + v + "\\b", "i").test(instrucciones);
    });
    if(pillados.length)
      add("error", "Estás pidiendo con adjetivos",
          "Has escrito: " + pillados.slice(0,4).join(", ") + ". Un adjetivo no es una instrucción porque no se puede comprobar. Cámbialo por una regla: en vez de \"profesional\", \"trato de usted y frases de menos de 25 palabras\".", "m1-l2");

    if(tiene(todo, /experto de clase mundial|el mejor (copywriter|redactor|marketer|publicista)|eres un expert|act[úu]a como el mejor/i))
      add("aviso", "El rol inflado añade menos de lo que parece",
          "\"El mejor copywriter del mundo\" está muy sobrevendido. Lo que sí funciona es un rol específico y verificable: \"escribes para una asesoría que no puede prometer resultados por normativa\".", "m1-l2");

    if(tiene(d.tarea, /h[aá]zlo mejor|mej[óo]ralo|m[áa]s creativ|dale una vuelta|que quede mejor/i))
      add("error", "Estás subiendo el tono, no la información",
          "Es el error número uno. Un mal resultado no se arregla pidiendo más empeño: se arregla dando más contexto.", "m1-l1");

    /* --- coherencia entre piezas ----------------------------------------- */
    if(largo(ctx) > 0 && largo(d.tarea) > 0 && largo(ctx) < largo(d.tarea))
      add("aviso", "Tu tarea es más larga que tu contexto",
          "Suele ser al revés. Si lo que explicas de tu negocio ocupa menos que lo que pides, va a rellenar los huecos por su cuenta.", "m1-l1");

    if(tiene(d.tarea, /perfil|persona|buyer/i) &&
       !tiene(ctx, /rese[ñn]a|llamada|entrevista|encuesta|ticket|datos|baja|search console|crm/i))
      add("aviso", "Vas a construir un perfil sin datos",
          "Un perfil sin fuentes reales es un personaje bien escrito. Dile de dónde salen los datos: reseñas, llamadas, bajas, tickets.", "m2-l1");

    if(tiene(todo, /\b(objetivo|m[ée]trica|kpi)\b/i) && !tiene(todo, /\d/))
      add("aviso", "Hay un objetivo sin número",
          "\"Más leads\" no es una métrica. \"40 leads cualificados antes del 30 de junio\" sí, y además se puede comprobar.", "m2-l3");

    /* --- las dos que casi nadie rellena ---------------------------------- */
    if(vac(d.formato))
      add("aviso", "Falta el formato",
          "Si no dices longitud y dónde se publica, recibes prosa. El formato es la diferencia entre algo que se puede publicar y algo que hay que reescribir.", "m1-l2");

    if(vac(d.restricciones))
      add("aviso", "No has puesto ninguna prohibición",
          "Las prohibiciones hacen más por la consistencia que cualquier descripción de tono, porque son inequívocas: seis palabras prohibidas se comprueban, \"cercano\" no.", "m1-l5");
    else
      add("bien", "Tienes prohibiciones puestas", "Es lo que más consistencia da.", null);

    if(vac(d.ejemplos))
      add("aviso", "No has pegado ningún ejemplo",
          "La sección que más rinde y la que casi nadie rellena, porque cuesta buscar las referencias. Dos piezas que te gustan enseñan más que un párrafo describiendo el tono. Búscalas una vez: sirven para siempre.", "m1-l2");
    else
      add("bien", "Has pegado ejemplos", "Es la pieza con más rendimiento del prompt.", null);

    /* --- puntuación ------------------------------------------------------ */
    var pesos = { negocio:12, cliente:16, objecion:14, tarea:18, formato:12, restricciones:12, ejemplos:16 };
    var pts = 0;
    Object.keys(pesos).forEach(function(k){ if(!vac(d[k])) pts += pesos[k]; });
    pts -= r.filter(function(x){ return x.n === "error"; }).length * 10;
    pts = Math.max(0, Math.min(100, pts));

    var veredicto = pts < 35 ? "Le falta lo esencial"
                  : pts < 60 ? "Va a salir genérico"
                  : pts < 80 ? "Sirve, se puede afinar"
                  : "Listo para enviar";

    var orden = { error:0, aviso:1, bien:2 };
    r.sort(function(a,b){ return orden[a.n] - orden[b.n]; });
    return { lista:r, pts:pts, veredicto:veredicto };
  }

  function ensamblar(){
    var d = borrador, p = [];
    var ctx = [];
    if(!vac(d.negocio))  ctx.push("Negocio: " + d.negocio.trim());
    if(!vac(d.cliente))  ctx.push("Cliente: " + d.cliente.trim());
    if(!vac(d.objecion)) ctx.push("Objeción principal: " + d.objecion.trim());
    if(!vac(d.probado))  ctx.push("Ya he probado, y no funcionó: " + d.probado.trim());
    if(ctx.length) p.push("CONTEXTO\n" + ctx.join("\n"));
    if(!vac(d.tarea))         p.push("TAREA\n" + d.tarea.trim());
    if(!vac(d.formato))       p.push("FORMATO\n" + d.formato.trim());
    if(!vac(d.restricciones)) p.push("RESTRICCIONES\n" + d.restricciones.trim());
    if(!vac(d.ejemplos))      p.push("EJEMPLOS DE LO QUE SÍ FUNCIONA\n" + d.ejemplos.trim());
    return p.join("\n\n");
  }

  var CAMPOS_UI = [
    { g:"Contexto", peso:"lo que más pesa", campos:[
      { id:"negocio",  et:"Qué vendes",           pista:"Producto o servicio, y el precio medio.",
        ph:"Instalación de placas solares a particulares. Ticket medio 7.500 €." },
      { id:"cliente",  et:"A quién",              pista:"Quién es y, sobre todo, qué le duele.",
        ph:"45-60 años, casa unifamiliar. No le mueve la ecología: le ha subido la factura." },

        ph:"\"¿Y si me mudo antes de amortizarlo?\"" },

        ph:"Pega aquí piezas tuyas o de la competencia que te funcionen." }

  ];

  var RAPIDOS = {
    formato: ["Un titular por línea, máx. 40 caracteres",
              "Post de LinkedIn, 150-200 palabras",
              "Email de 120-160 palabras, cierre con teléfono",
              "Guion de 40 segundos, con el conflicto en los 3 primeros"],
    tarea:   ["Antes de escribir, lista 3 ángulos posibles y para. No escribas todavía."]
  };

  function vistaTaller(){
    var h = '<h1>Taller de prompts</h1>';
    h += '<p style="max-width:64ch;color:var(--ink-2);margin:0 0 26px">Rellena las piezas y el ' +
         'taller monta el prompt mientras te va corrigiendo. Los avisos salen de las lecciones ' +
         'del curso, y cada uno te lleva a la suya.</p>';

    h += '<div class="taller"><div class="t-campos">';
    CAMPOS_UI.forEach(function(g){
      h += '<div class="t-grupo"><header><h3>' + esc(g.g) + '</h3>' +
           (g.peso ? '<span class="peso">' + esc(g.peso) + '</span>' : '') + '</header><div class="t-cuerpo">';
      g.campos.forEach(function(c){
        h += '<div class="t-campo"><label for="tc-' + c.id + '">' + esc(c.et) +
             '<span class="pista">' + esc(c.pista) + '</span></label>' +
             '<textarea id="tc-' + c.id + '" data-campo="' + c.id + '" placeholder="' + esc(c.ph) + '">' +
             esc(borrador[c.id] || "") + '</textarea>';
        if(RAPIDOS[c.id]){
          h += '<div class="t-rapidos">' + RAPIDOS[c.id].map(function(x){
            return '<button class="t-rapido" type="button" data-rapido="' + c.id +
                   '" data-txt="' + esc(x) + '">' + esc(x) + '</button>';
          }).join("") + '</div>';
        }
        h += '</div>';
      });
      h += '</div></div>';
    });
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
         '<button class="ghost" type="button" id="tEjemplo">Cargar un ejemplo</button>' +
         '<button class="ghost" type="button" id="tVaciar">Vaciar</button></div>';
    h += '</div>';

    h += '<div class="t-lado"><div id="tLado"></div></div></div>';
    h += '<div id="tSalida" style="margin-top:34px"></div>';
    return h;
  }

  function refrescarTaller(){
    var a = analizar();
    var nivel = a.pts >= 80 ? "alto" : a.pts < 35 ? "bajo" : "medio";

    var h = '<div class="t-marcador"><p class="k">Estado del prompt</p>' +
      '<p class="t-veredicto">' + esc(a.veredicto) + '</p>' +
      '<span class="t-pista-barra"><span class="t-relleno" data-nivel="' + nivel +
      '" style="width:' + a.pts + '%"></span></span>' +
      '<p class="sub">' + a.lista.filter(function(x){return x.n==="error";}).length + ' errores · ' +
      a.lista.filter(function(x){return x.n==="aviso";}).length + ' avisos</p></div>';

    h += '<div class="t-diag">';
    a.lista.forEach(function(x){
      h += '<div class="d" data-n="' + x.n + '"><div class="cab">' +
           '<span class="et">' + (x.n === "error" ? "Corrige" : x.n === "aviso" ? "Mejora" : "Bien") + '</span>' +
           '<span class="t">' + esc(x.t) + '</span></div><p>' + esc(x.p) + '</p>' +
           (x.lec && indicePorId(x.lec) >= 0
             ? '<button class="ver" type="button" data-ir="' + indicePorId(x.lec) + '">ver la lección</button>'
             : '') + '</div>';
    });
    h += '</div>';

    h += '<p class="t-limite">Esto comprueba <b>qué falta</b> y errores conocidos, ' +
         'no si tu contexto es bueno. Eso no lo puede saber una regla: un prompt con ' +
         'todo en verde y un contexto flojo sigue dando un resultado flojo.</p>';

    $("tLado").innerHTML = h;

    var texto = ensamblar();
    $("tSalida").innerHTML = texto
      ? '<h2 class="seccion">Tu prompt</h2><div class="body">' +
        pintarBloque({ t:"prompt", titulo:"listo para pegar en Claude", texto:texto }) + '</div>'
      : '';
  }

  function crecer(ta){
    ta.style.height = "auto";
    ta.style.height = Math.max(62, ta.scrollHeight + 2) + "px";
  }

  function engancharTaller(){
    var t = null;
    document.querySelectorAll("[data-campo]").forEach(function(ta){
      crecer(ta);
      ta.addEventListener("input", function(){
        crecer(ta);
        borrador[ta.getAttribute("data-campo")] = ta.value;
        clearTimeout(t);
        t = setTimeout(function(){ guardarBorrador(); refrescarTaller(); }, 220);
      });
    });
    document.querySelectorAll("[data-rapido]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = b.getAttribute("data-rapido"), txt = b.getAttribute("data-txt");
        var ta = $("tc-" + c);
        ta.value = ta.value.trim() ? ta.value.trim() + "\n" + txt : txt;
        crecer(ta);
        borrador[c] = ta.value; guardarBorrador(); refrescarTaller();
      });
    });
    $("tEjemplo").addEventListener("click", function(){
      CAMPOS.forEach(function(c){ borrador[c] = EJEMPLO[c] || ""; });
      guardarBorrador(); pintar();
    });
    $("tVaciar").addEventListener("click", function(){
      CAMPOS.forEach(function(c){ borrador[c] = ""; });
      guardarBorrador(); pintar();
    });
    refrescarTaller();
  }

  /* ===================================================== vista: portada */
  function colofon(){
    var a = CFG.autor || {};
    var h = '<div class="colofon"><p class="k">Quién ha hecho este curso</p>';
    h += '<p class="quien">' + esc(a.nombre || CURSO.autor || "") +
         (a.empresa ? ' · ' + esc(a.empresa) : '') + '</p>';
    if(a.frase) h += '<p>' + esc(a.frase) + '</p>';
    var vias = [];
    if(a.web)   vias.push('<a href="' + esc(a.web) + '" target="_blank" rel="noopener">' +
                          esc(a.web.replace(/^https?:\/\//,"")) + '</a>');
    if(a.email) vias.push('<a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a>');
    if(vias.length) h += '<p>' + vias.join(' · ') + '</p>';

    if(LIC){
      h += '<p class="licencia">Copia emitida para <b>' + esc(CFG.licencia.nombre) + '</b>' +
           (CFG.licencia.email ? ' &lt;' + esc(CFG.licencia.email) + '&gt;' : '') +
           (CFG.licencia.emitida ? ' el ' + esc(CFG.licencia.emitida) : '') +
           '.<br>Es tuya para siempre: funciona sin conexión y no caduca. ' +
           'Te pido que no la reenvíes — lleva tu nombre dentro.</p>';
    }
    return h + '</div>';
  }

  function vistaInicio(){
    var total = planas.length;
    var min = planas.reduce(function(a,p){ return a + (p.les.duracion||0); }, 0);
    var nPrompts = todosLosPrompts().length;
    var cowork = planas.filter(function(p){ return p.les.plataforma === "Cowork"; }).length;
    var hechas = planas.filter(function(p){ return Almacen.hechas[p.les.id]; }).length;

    for(var i=0;i<planas.length;i++){ if(!Almacen.hechas[planas[i].les.id]){ sig = i; break; } }

    var h = '<div class="portada">';
    h += '<p class="portada-eyebrow">' + (LIC ? "Licencia de " + esc(CFG.licencia.nombre)
                                              : "Curso · v" + esc(CURSO.version || "1")) + '</p>';
    h += '<h1>' + esc(CURSO.titulo) + '</h1>';
    h += '<p class="lead">' + esc(CURSO.subtitulo || "") + '</p>';
    h += '<p class="intro">Los doce casos de uso de marketing que publica Anthropic, ' +
         'reordenados por ciclo de trabajo real y precedidos de lo que hay que saber ' +
         'para que ninguno salga mediocre. Cada lección termina en algo que puedes ' +
         'aplicar el lunes: un prompt listo para copiar, el error que la arruina y un ' +
         'ejercicio sobre material tuyo, no de juguete.</p>';

    h += '<div class="kpis">' +
      '<div class="kpi"><p class="k">Lecciones</p><p class="v">' + total + '</p></div>' +
      '<div class="kpi"><p class="k">Duración</p><p class="v">' + Math.round(min/60*10)/10 + '<small>h</small></p></div>' +
      '<div class="kpi"><p class="k">Prompts listos</p><p class="v">' + nPrompts + '</p></div>' +
      '<div class="kpi"><p class="k">Módulos</p><p class="v">' + CURSO.modulos.length + '</p></div>' +
      '</div>';

    h += '<button class="siguiente" type="button" data-ir="' + sig + '">' +
         '<p class="k">' + (hechas ? "Continuar por aquí" : "Empezar por el principio") + '</p>' +
         '<p class="t">' + esc(planas[sig].les.titulo) + '</p>' +
         '<p class="d">Módulo ' + planas[sig].mi + ' · ' + planas[sig].les.duracion + ' min' +
         (hechas ? ' · llevas ' + hechas + ' de ' + total : '') + '</p></button>';

    h += '<h2 class="seccion">Lo que hay dentro</h2><div class="mods-lista">';
    CURSO.modulos.forEach(function(mod, mi){
      var idx = indicePorId(mod.lecciones[0].id);
      var mm = mod.lecciones.reduce(function(a,l){ return a + (l.duracion||0); }, 0);
      h += '<button class="mod-fila" type="button" data-ir="' + idx + '">' +
           '<span class="n">M' + (mi+1) + '</span>' +
           '<span class="t">' + esc(mod.titulo) + '</span>' +
           '<span class="c">' + mod.lecciones.length + ' · ' + mm + ' min</span>' +
           '<span class="r">' + esc(mod.resumen || "") + '</span></button>';
    });
    h += '</div>';

    h += '<h2 class="seccion">Qué necesitas</h2><div class="requisitos">' +
      '<div class="req"><p class="b"><span class="badge">Claude.ai</span></p>' +
      '<p>' + (total - cowork) + ' lecciones. Con una cuenta gratuita se siguen; ' +
      'las skills y los proyectos piden plan de pago.</p></div>' +
      '<div class="req"><p class="b"><span class="badge cowork">Cowork</span></p>' +
      '<p>' + cowork + ' lecciones. Necesita plan de pago de Claude. Si no lo tienes, ' +
      'filtra el índice por Claude.ai y hazlas más adelante.</p></div>' +
