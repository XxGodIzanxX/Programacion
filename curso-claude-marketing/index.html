  /* =============================================== vista: panel de avance */
  function vistaProgreso(){
    var total = planas.length;
    var n = planas.filter(function(p){ return Almacen.hechas[p.les.id]; }).length;
    var pct = total ? Math.round(n / total * 100) : 0;
    var minHechos = planas.filter(function(p){ return Almacen.hechas[p.les.id]; })
                          .reduce(function(a,p){ return a + (p.les.duracion||0); }, 0);
    var minTotal = planas.reduce(function(a,p){ return a + (p.les.duracion||0); }, 0);
    var conNota = Object.keys(Almacen.notas).filter(function(k){ return (Almacen.notas[k]||"").trim(); }).length;
    var cowork = planas.filter(function(p){ return p.les.plataforma === "Cowork"; }).length;

    var h = '<h1>Tu avance</h1>';
    h += '<div class="hero-cifra"><span class="n">' + pct + '</span><span class="u">%</span></div>';
    h += '<p class="hero-pie">' + n + ' de ' + total + ' lecciones. ' +
         (n === total ? 'Curso completado.' : 'Te quedan ' + (minTotal - minHechos) + ' minutos.') + '</p>';

    h += '<div class="kpis">' +
      '<div class="kpi"><p class="k">Completadas</p><p class="v">' + n + '<small>/ ' + total + '</small></p></div>' +
      '<div class="kpi"><p class="k">Tiempo hecho</p><p class="v">' + minHechos + '<small>min</small></p></div>' +
      '<div class="kpi"><p class="k">Te queda</p><p class="v">' + (minTotal - minHechos) + '<small>min</small></p></div>' +
      '<div class="kpi"><p class="k">Con notas</p><p class="v">' + conNota + '<small>/ ' + total + '</small></p></div>' +
      '</div>';

    var sig = null;
    for(var i=0;i<planas.length;i++){ if(!Almacen.hechas[planas[i].les.id]){ sig = i; break; } }
    if(sig !== null){
      var s = planas[sig];
      h += '<button class="siguiente" type="button" data-ir="' + sig + '">' +
           '<p class="k">Continuar por aquí</p>' +
           '<p class="t">' + esc(s.les.titulo) + '</p>' +
           '<p class="d">Módulo ' + s.mi + ' · ' + s.les.duracion + ' min · ' +
           esc(s.les.plataforma || "Claude.ai") + '</p></button>';
    }

    h += '<h2 class="seccion">Por módulo</h2><div class="medidores">';
    CURSO.modulos.forEach(function(mod, mi){
      var t = mod.lecciones.length;
      var c = mod.lecciones.filter(function(l){ return Almacen.hechas[l.id]; }).length;
      var pp = t ? Math.round(c/t*100) : 0;
      h += '<div class="med-fila">' +
           '<span class="med-nom">M' + (mi+1) + ' · ' + esc(mod.titulo) + '</span>' +
           '<span class="med-cif">' + c + '/' + t + '</span>' +
           '<span class="med-pista"><span class="med-relleno" style="width:' + pp + '%"' +
           (c === t ? ' data-lleno="true"' : '') + '></span></span></div>';
    });
    h += '</div>';

    h += '<h2 class="seccion">Tu ruta</h2>';
    h += '<p style="max-width:62ch;color:var(--ink-2)">' + cowork + ' de las ' + total +
         ' lecciones se ejecutan en Cowork, que necesita un plan de pago de Claude. ' +
         'Si no lo tienes, filtra el índice por <strong>Claude.ai</strong>: te quedan ' +
         (total - cowork) + ' lecciones completas y el método de las otras se entiende igual, ' +
         'aunque el ejercicio no lo puedas hacer.</p>';

    var notas = planas.filter(function(p){ return (Almacen.notas[p.les.id]||"").trim(); });
    if(notas.length){
      h += '<h2 class="seccion">Tus notas</h2><div class="glos">';
      notas.forEach(function(p){
        h += '<dl class="gl"><dt>' + esc(p.les.titulo) +
             ' <span class="gl-cat">M' + p.mi + '.' + p.li + '</span></dt>' +
             '<dd>' + esc(Almacen.notas[p.les.id]).replace(/\n/g,"<br>") + '</dd></dl>';
      });
      h += '</div>';
    }
    return h;
  }

  /* ============================================ vista: biblioteca de prompts */
  function todosLosPrompts(){
    var out = [];
    planas.forEach(function(p){
      (p.les.bloques || []).forEach(function(b, bi){
        if(b.t === "prompt" || b.t === "archivo"){
          out.push({
            tipo: b.t,
            titulo: b.titulo || b.nombre || "",
            texto: b.texto || "",
            les: p.les, mi: p.mi, li: p.li, idx: indicePorId(p.les.id), bi: bi
          });
        }
      });
    });
    return out;
  }

  function vistaPrompts(){
    var lista = todosLosPrompts();
    var f = ($("search").value || "").trim().toLowerCase();
    var vis = lista.filter(function(x){
      if(filtroPrompt === "prompt"  && x.tipo !== "prompt")  return false;
      if(filtroPrompt === "archivo" && x.tipo !== "archivo") return false;
      if(filtroPrompt === "cowork"  && x.les.plataforma !== "Cowork") return false;
      if(!f) return true;
      return (x.titulo + " " + x.texto + " " + x.les.titulo).toLowerCase().indexOf(f) >= 0;
    });

    var h = '<h1>Biblioteca de prompts</h1>';
    h += '<p style="max-width:64ch;color:var(--ink-2);margin:0 0 24px">Los ' + lista.length +
         ' prompts y archivos del curso en un solo sitio, para cuando ya sabes lo que buscas ' +
         'y no quieres volver a la lección. El buscador del panel izquierdo filtra también aquí.</p>';

    h += '<div class="prompt-filtros">' +
      '<button class="pf" type="button" data-pf="todo"    aria-pressed="' + (filtroPrompt==="todo") + '">TODOS · ' + lista.length + '</button>' +
      '<button class="pf" type="button" data-pf="prompt"  aria-pressed="' + (filtroPrompt==="prompt") + '">PROMPTS</button>' +
      '<button class="pf" type="button" data-pf="archivo" aria-pressed="' + (filtroPrompt==="archivo") + '">ARCHIVOS</button>' +
      '<button class="pf" type="button" data-pf="cowork"  aria-pressed="' + (filtroPrompt==="cowork") + '">DE COWORK</button>' +
      '</div>';

    if(!vis.length) return h + '<p class="vacio">Ningún prompt coincide con la búsqueda.</p>';

    h += '<div class="body">';
    vis.forEach(function(x){
      h += '<p class="p-origen">' + x.mi + '.' + x.li + ' · ' + esc(x.les.titulo) +
           ' <button type="button" data-ir="' + x.idx + '">ir a la lección</button></p>';
      h += pintarBloque(x.tipo === "prompt"
        ? { t:"prompt",  titulo:x.titulo, texto:x.texto }
        : { t:"archivo", nombre:x.titulo, texto:x.texto });
    });
    return h + '</div>';
  }

  /* ==================================================== vista: glosario */
  function vistaGlosario(){
    var f = ($("search").value || "").trim().toLowerCase();
    var G = (typeof GLOSARIO !== "undefined") ? GLOSARIO : [];
    var vis = G.filter(function(g){
      if(!f) return true;
      return (g.t + " " + g.d + " " + g.m).toLowerCase().indexOf(f) >= 0;
    }).slice().sort(function(a,b){ return a.t.localeCompare(b.t, "es"); });

    var h = '<h1>Glosario</h1><p style="max-width:64ch;color:var(--ink-2);margin:0 0 26px">' +
            'Los términos del curso, en orden alfabético. Cada uno dice en qué lección se trabaja a fondo.</p>';
    if(!vis.length) return h + '<p class="vacio">Ningún término coincide.</p>';
    h += '<div class="glos">';
    vis.forEach(function(g){
      h += '<dl class="gl"><dt>' + esc(g.t) + ' <span class="gl-cat">' + esc(g.m) + '</span></dt>' +
           '<dd>' + md(g.d) + '</dd></dl>';
    });
    return h + '</div>';
  }

  /* ============================================================== pintar */
  function pintar(){
    var h = "";
    if(vista === "inicio")        h = vistaInicio();
    else if(vista === "taller")   h = vistaTaller();
    else if(vista === "curso")    h = vistaCurso();
    else if(vista === "prompts")  h = vistaPrompts();
    else if(vista === "progreso") h = vistaProgreso();
    else                          h = vistaGlosario();
    $("vista").innerHTML = h;

    $("zonaBusca").hidden = (vista === "progreso" || vista === "inicio" || vista === "taller");
    document.querySelectorAll(".pest").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-vista") === vista ? "true" : "false");
    });
    $("search").placeholder = vista === "curso" ? "Buscar lección…"
                            : vista === "prompts" ? "Buscar en los prompts…"
                            : "Buscar término…";
    document.querySelectorAll(".chips")[0].hidden = (vista !== "curso");

    if(vista === "curso" && planas[actual]){
      $("topTitle").textContent = planas[actual].les.titulo;
      guardaLocal(LLAVE + ":ultima", planas[actual].les.id);
      engancharNota();
    }else{
      $("topTitle").textContent = vista === "prompts" ? "Prompts"
                                : vista === "progreso" ? "Avance"
                                : vista === "inicio" ? "Inicio"
                                : vista === "taller" ? "Taller" : "Glosario";
      if(vista === "taller") engancharTaller();
    }
    pintarArbol();
  }

  function engancharNota(){
    var ta = $("notaTxt");
    if(!ta) return;
    var id = planas[actual].les.id, t = null;
    ta.addEventListener("input", function(){
      clearTimeout(t);
      var est = $("notaEstado");
      if(est) est.textContent = "";
      t = setTimeout(function(){
        Almacen.guardarNota(id, ta.value);
        if(est){
          est.textContent = "guardado";
          setTimeout(function(){ if(est) est.textContent = ""; }, 1800);
        }
      }, 700);
    });
  }

  function ir(i){
    if(i < 0 || i >= planas.length) return;
    actual = i; vista = "curso";
    document.querySelectorAll("[data-vista]").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-vista") === "curso" ? "true" : "false");
    });
    pintar();
    window.scrollTo({ top:0, behavior:"auto" });
    cerrarRail();
  }

  /* ============================================================== acceso */
  function pantallaAcceso(modo){
    var registrando = modo === "registro";
    var h = '<div class="tarjeta">' +
      '<h2>' + (registrando ? "Crear cuenta" : "Entrar al curso") + '</h2>' +
      '<p class="lead">' + (registrando
        ? "Tu avance y tus notas quedan asociados a la cuenta."
        : "Continúa por donde lo dejaste.") + '</p>' +
      '<form id="formAcceso" novalidate>';
    if(registrando){
      h += '<div class="campo"><label for="fNombre">Nombre</label>' +
           '<input id="fNombre" type="text" autocomplete="name" required></div>';
    }
    h += '<div class="campo"><label for="fEmail">Correo</label>' +
         '<input id="fEmail" type="email" autocomplete="email" required></div>';
    if(NUBE){
      h += '<div class="campo"><label for="fClave">Contraseña</label>' +
           '<input id="fClave" type="password" autocomplete="' +
           (registrando ? "new-password" : "current-password") + '" required></div>';
    }
    h += '<button class="principal" type="submit">' +
         (registrando ? "Crear cuenta" : "Entrar") + '</button></form>' +
      '<div id="errAcceso"></div>' +
      '<button class="alterno" type="button" id="cambiarModo">' +
        (registrando ? 'Ya tengo cuenta. <b>Entrar</b>' : '¿Primera vez? <b>Crear cuenta</b>') +
      '</button>' +
      '<button class="alterno" type="button" id="cerrarAcceso">Seguir sin identificarme</button>';

    h += '<p class="nota-modo">' + (NUBE
      ? "Sesión sincronizada: tu avance viaja entre dispositivos."
      : "Modo local: sin servidor detrás. La sesión sirve para separar a varias personas en " +
        "este mismo equipo, y no protege el contenido.") + '</p></div>';

    $("velo").innerHTML = h;
    $("velo").hidden = false;
    var primero = $("fNombre") || $("fEmail");
    if(primero) primero.focus();

    $("cambiarModo").onclick = function(){ pantallaAcceso(registrando ? "entrar" : "registro"); };
    $("cerrarAcceso").onclick = function(){
      if(NUBE && CFG.accesoCerrado){
        $("errAcceso").innerHTML = '<p class="error">Este curso es de acceso cerrado. ' +
          'Necesitas una cuenta para verlo.</p>';
        return;
      }
      $("velo").hidden = true; $("velo").innerHTML = "";
    };
    $("formAcceso").onsubmit = function(ev){
      ev.preventDefault();
      var email = ($("fEmail").value || "").trim();
      var nombre = $("fNombre") ? ($("fNombre").value || "").trim() : "";
      var clave = $("fClave") ? $("fClave").value : "";
      var err = $("errAcceso");
      err.innerHTML = "";
      if(!email || email.indexOf("@") < 1){
        err.innerHTML = '<p class="error">Ese correo no parece válido.</p>'; return;
      }
      if(registrando && !nombre){
        err.innerHTML = '<p class="error">Falta el nombre.</p>'; return;
      }
      if(NUBE) accesoNube(registrando, nombre, email, clave, err);
      else accesoLocal(registrando, nombre, email, err);
    };
  }

  function accesoLocal(registrando, nombre, email, err){
    var us = usuariosLocales();
    var yaEsta = null;
    us.forEach(function(u){ if(u.email === email.toLowerCase()) yaEsta = u; });
    if(registrando){
      if(yaEsta){
        err.innerHTML = '<p class="error">Ya hay una cuenta con ese correo en este equipo. Entra en vez de registrarte.</p>';
        return;
      }
      var nuevo = { id:"loc-" + Date.now().toString(36), nombre:nombre, email:email.toLowerCase() };
      us.push(nuevo); guardaUsuariosLocales(us);
      entrar(nuevo);
    }else{
      if(!yaEsta){
        err.innerHTML = '<p class="error">No hay ninguna cuenta con ese correo en este equipo. Crea una cuenta.</p>';
        return;
      }
      entrar(yaEsta);
    }
  }

  function accesoNube(registrando, nombre, email, clave, err){
    var sb = sesion.sb;
    if(!sb){ err.innerHTML = '<p class="error">No se ha podido conectar. Prueba a recargar.</p>'; return; }
    var pet = registrando
      ? sb.auth.signUp({ email:email, password:clave, options:{ data:{ nombre:nombre } } })
      : sb.auth.signInWithPassword({ email:email, password:clave });
    pet.then(function(r){
      if(r.error){ err.innerHTML = '<p class="error">' + esc(r.error.message) + '</p>'; return; }
      if(registrando && r.data && r.data.user && !r.data.session){
        err.innerHTML = '<p class="error">Cuenta creada. Confirma el correo que te hemos enviado y vuelve a entrar.</p>';
        return;
      }
      var u = r.data.user;
      entrar({ id:u.id, nombre:(u.user_metadata && u.user_metadata.nombre) || email.split("@")[0], email:email });
    }, function(){
      err.innerHTML = '<p class="error">No se ha podido conectar con el servidor.</p>';
    });
  }

  function entrar(usuario){
    sesion.usuario = usuario;
    guardaLocal(LLAVE + ":sesion", JSON.stringify(usuario));
    $("velo").hidden = true; $("velo").innerHTML = "";
    Almacen.cargar().then(function(){ pintarSesion(); pintar(); });
  }

  function salir(){
    if(NUBE && sesion.sb) sesion.sb.auth.signOut();
    sesion.usuario = null;
    try{ localStorage.removeItem(LLAVE + ":sesion"); }catch(e){}
    Almacen.cargar().then(function(){
      pintarSesion();
      if(NUBE && CFG.accesoCerrado) pantallaAcceso("entrar");
      else pintar();
    });
  }

  /* ============================================================ eventos */
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-ir]");
    if(t && !t.disabled){ ir(parseInt(t.getAttribute("data-ir"), 10)); return; }

    var pest = ev.target.closest("[data-vista]");
    if(pest){
      vista = pest.getAttribute("data-vista");
      document.querySelectorAll("[data-vista]").forEach(function(b){
        b.setAttribute("aria-selected", b === pest ? "true" : "false");
      });
      pintar(); cerrarRail(); window.scrollTo({ top:0, behavior:"auto" });
      return;
    }

    var pf = ev.target.closest("[data-pf]");
    if(pf){ filtroPrompt = pf.getAttribute("data-pf"); pintar(); return; }

    var chip = ev.target.closest("[data-plat]");
    if(chip){
      filtroPlat = chip.getAttribute("data-plat");
      document.querySelectorAll("[data-plat]").forEach(function(c){
        c.setAttribute("aria-pressed", c === chip ? "true" : "false");
      });
      pintarArbol();
      return;
    }

    var tog = ev.target.closest("[data-toggle]");
    if(tog){
      var box = tog.parentElement;
      box.setAttribute("data-open", box.getAttribute("data-open") === "true" ? "false" : "true");
      return;
    }

    var cp = ev.target.closest("[data-copiar]");
    if(cp){
      var pre = cp.closest(".prompt, .archivo").querySelector("pre");
      var ok = function(){
        cp.textContent = "Copiado"; cp.classList.add("ok");
        setTimeout(function(){ cp.textContent = "Copiar"; cp.classList.remove("ok"); }, 1600);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(pre.textContent).then(ok, function(){ seleccionar(pre); });
      }else seleccionar(pre);
      return;
    }

    if(ev.target.id === "marcar"){
      var id = planas[actual].les.id;
      Almacen.marcar(id, !Almacen.hechas[id]);
      pintar();
      return;
    }
    if(ev.target.id === "entrarBtn" || ev.target.id === "entrarInline"){ pantallaAcceso("entrar"); return; }
    if(ev.target.id === "salirBtn"){ salir(); return; }
    if(ev.target.id === "menuBtn"){ abrirRail(); return; }
    if(ev.target.id === "scrim"){ cerrarRail(); return; }
    if(ev.target.id === "themeBtn"){
      var r = document.documentElement;
      var oscuro = r.getAttribute("data-theme") === "dark" ||
                   (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      r.setAttribute("data-theme", oscuro ? "light" : "dark");
      guardaLocal(LLAVE + ":tema", r.getAttribute("data-theme"));
      return;
    }
  });

  function seleccionar(pre){
    var sel = window.getSelection(), rango = document.createRange();
    rango.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(rango);
  }
  function abrirRail(){ $("rail").setAttribute("data-open","true"); $("scrim").hidden = false; }
  function cerrarRail(){ $("rail").setAttribute("data-open","false"); $("scrim").hidden = true; }

  $("search").addEventListener("input", function(){
    if(vista === "curso") pintarArbol(); else pintar();
  });
  document.addEventListener("keydown", function(ev){
    if(ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
    if(vista !== "curso") return;
    if(ev.key === "ArrowRight") ir(actual + 1);
    if(ev.key === "ArrowLeft")  ir(actual - 1);
  });

  /* ============================================================ arranque */
  var tema = leeLocal(LLAVE + ":tema");
  if(tema) document.documentElement.setAttribute("data-theme", tema);

  var ult = leeLocal(LLAVE + ":ultima");
  if(ult){ var iu = indicePorId(ult); if(iu >= 0) actual = iu; }

  if(LIC){
    sesion.usuario = { id:"lic", nombre:CFG.licencia.nombre, email:CFG.licencia.email || "" };
  }else{
    try{
      var guardado = leeLocal(LLAVE + ":sesion");
      if(guardado) sesion.usuario = JSON.parse(guardado);
    }catch(e){}
  }
  if(!leeLocal(LLAVE + ":ultima")) vista = "inicio";

  pintarCabecera();
  cargarBorrador();

  function arrancar(){
    Almacen.cargar().then(function(){
      cargarBorrador();
      pintarSesion();
      pintar();
      if(NUBE && CFG.accesoCerrado && !sesion.usuario) pantallaAcceso("entrar");
    });
  }

  if(NUBE){
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
    sc.onload = function(){
      try{
        sesion.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
        sesion.sb.auth.getUser().then(function(r){
          if(r && r.data && r.data.user){
            var u = r.data.user;
            sesion.usuario = { id:u.id, nombre:(u.user_metadata && u.user_metadata.nombre) || u.email.split("@")[0], email:u.email };
          }else{
            sesion.usuario = null;
          }
          arrancar();
        }, arrancar);
      }catch(e){ arrancar(); }
    };
    sc.onerror = arrancar;
    document.head.appendChild(sc);
  }else{
    arrancar();
  }
})();
</script>
</body>
</html>
